[package]
name = "spanscope"
description = "Rust execution profiler with sync and async spans, call chains, and offline reports"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"
include = ["src/**", "tests/**", "examples/**", "benches/**", "assets/viewer.html", "assets/THIRD-PARTY-NOTICES.md", "Cargo.toml", "README.md", "LICENSE-*"]

[features]
default = []
enabled = ["spanscope-macros/enabled", "serialization", "dep:flate2", "dep:libc"]
serialization = ["dep:serde", "dep:serde_json"]
schema = ["serialization", "dep:schemars"]
memory = ["enabled"]
alloc-tracker = ["memory"]
ml = ["enabled"]
viewer = ["enabled"]

[dependencies]
spanscope-macros = { path = "../spanscope-macros", version = "=0.1.0", default-features = false }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
schemars = { workspace = true, optional = true }
flate2 = { version = "1.1.4", optional = true }
libc = { version = "0.2.177", optional = true }

[dev-dependencies]
trybuild.workspace = true
criterion.workspace = true
rayon = "1.12.0"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "time"] }

[[bench]]
name = "sync_span"
harness = false
required-features = ["enabled"]

[[example]]
name = "schema"
required-features = ["schema"]

[[example]]
name = "tokio_tasks"
required-features = ["enabled"]

[[example]]
name = "rayon_workers"
required-features = ["enabled"]

[[example]]
name = "recursion"
required-features = ["enabled"]

[[test]]
name = "profile_contract"
required-features = ["serialization"]

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[[example]]
name = "export_profile"
required-features = ["enabled"]
