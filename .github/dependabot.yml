version: 2

# Group minor and patch updates. Major version updates need separate review.
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      cargo:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # trybuild 1.0.121 pulls in crates that require a newer Cargo than 1.80.
      - dependency-name: trybuild
        versions: [">= 1.0.121"]
      # Newer releases pull in TOML crates that Cargo 1.80 cannot parse.
      - dependency-name: proc-macro-crate
        versions: ["> 3.2.0"]

  - package-ecosystem: npm
    directory: /viewer
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      viewer:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      actions:
        patterns: ["*"]
